[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbpi4-brewdio"
version = "0.2.0"
description = "Synchronize Brewdio recipes into CraftBeerPi 4"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.8",
  "PyYAML>=6.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sammynorway/brewdio-craftbeerpi-plugin"
Repository = "https://github.com/sammynorway/brewdio-craftbeerpi-plugin.git"
Issues = "https://github.com/sammynorway/brewdio-craftbeerpi-plugin/issues"

[tool.setuptools]
packages = ["cbpi4_brewdio"]

[tool.setuptools.package-data]
cbpi4_brewdio = ["config.yaml"]
